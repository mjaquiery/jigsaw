name: Check picture sources

# Talks to Wikimedia Commons, the Art Institute of Chicago and The Met to
# make sure suggestions still work. Runs weekly, on demand, and when the
# source code changes.
on:
  push:
    paths: [src/sources.ts, tests/live-sources.test.ts, .github/workflows/check-sources.yml]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-sources
